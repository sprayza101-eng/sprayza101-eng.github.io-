<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องคิดเลขค่างวด (ดอกเบี้ยต่อเดือน)</title>
    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --bg-color: #f8f9fa;
            --text-color: #333;
        }

        body {
            font-family: 'Tahoma', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .calculator-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 25px;
            font-size: 24px;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .input-box label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--secondary-color);
        }

        .input-box input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 18px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .input-box input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .divider {
            border: 0;
            border-top: 1px solid #eee;
            margin: 20px 0;
            position: relative;
        }

        .divider::after {
            content: "ค่างวดต่อเดือน";
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 0 15px;
            font-size: 12px;
            color: #999;
        }

        .result-row {
            display: grid;
            grid-template-columns: 2fr 1fr 50px;
            align-items: center;
            margin-bottom: 12px;
            gap: 10px;
        }

        .answer-box {
            background-color: #f1f8ff;
            color: var(--primary-color);
            padding: 12px;
            border-radius: 8px;
            text-align: right;
            font-weight: bold;
            font-size: 20px;
            border: 1px solid #d0e3ff;
        }

        .month-box {
            background-color: #343a40;
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        .unit-label {
            font-size: 14px;
            color: #666;
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #aaa;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="calculator-container">
    <h2>คำนวณค่างวดผ่อน</h2>
    
    <div class="input-group">
        <div class="input-box">
            <label>ราคา (บาท)</label>
            <input type="number" id="price" placeholder="0" oninput="calculate()">
        </div>
        <div class="input-box">
            <label>ดอกเบี้ย (% ต่อเดือน)</label>
            <input type="number" id="interest" placeholder="0.00" step="0.01" oninput="calculate()">
        </div>
    </div>

    <div class="divider"></div>

    <div id="results-area">
        </div>

    <div class="footer-note">
        * สูตรคำนวณแบบดอกเบี้ย สร้างโดยนะ
    </div>
</div>

<script>
    const months = [12, 18, 24, 36, 48];
    const resultsArea = document.getElementById('results-area');

    // สร้างโครงสร้างแถวผลลัพธ์
    months.forEach((m, i) => {
        resultsArea.innerHTML += `
            <div class="result-row">
                <div class="answer-box" id="ans${i}">0.00</div>
                <div class="month-box">${m}</div>
                <div class="unit-label">เดือน</div>
            </div>
        `;
    });

    function calculate() {
        // ดึงค่า input
        const price = parseFloat(document.getElementById('price').value) || 0;
        const interestRateMonth = parseFloat(document.getElementById('interest').value) || 0;

        months.forEach((month, index) => {
            let perMonth = 0;

            if (price > 0) {
                // สูตร: (เงินต้น + (เงินต้น * ดอกเบี้ยต่อเดือน/100 * จำนวนเดือน)) / จำนวนเดือน
                const totalInterest = price * (interestRateMonth / 100) * month;
                const totalAmount = price + totalInterest;
                perMonth = totalAmount / month;
            }

            // แสดงผลลัพธ์
            const resultElement = document.getElementById('ans' + index);
            resultElement.innerText = perMonth.toLocaleString(undefined, {
                minimumFractionDigits: 2, 
                maximumFractionDigits: 2
            });
        });
    }
</script>

</body>
</html>
